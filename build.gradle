plugins {
    id "net.fabricmc.fabric-loom" version '1.19.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:sodium:${project.sodium_version_internal}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")
    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")
    compileOnly("maven.modrinth:iris:${iris_version}")
}

processResources {
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_version", project.java_version
    inputs.property "loader_version", project.loader_version
    inputs.property "mod_version", project.mod_version

    inputs.property "fabric_api_version", project.fabric_api_version
    inputs.property "sodium_version", project.sodium_version
    inputs.property "yacl_version", project.yacl_version
    inputs.property "modmenu_version", project.modmenu_version
    inputs.property "iris_version", project.iris_version

    filesMatching("fabric.mod.json") {
        expand  "minecraft_version": project.minecraft_version,
                "java_version": project.java_version,
                "loader_version": project.loader_version,
                "mod_version": project.mod_version,

                "fabric_api_version": project.fabric_api_version,
                "sodium_version": project.sodium_version,
                "yacl_version": project.yacl_version,
                "modmenu_version": project.modmenu_version,
                "iris_version": project.iris_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}
// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}